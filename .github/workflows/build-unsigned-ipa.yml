name: Build unsigned IPA                                                                                                                                                                                                                                                                                                                  
on:                                                                                                                                                                                                                                                                                                                                       
  workflow_dispatch:                                                                                                                                                                                                                                                                                                                      
jobs:                                                                                                                                                                                                                                                                                                                                     
  build:                                                                                                                                                                                                                                                                                                                                  
    runs-on: macos-14                                                                                                                                                                                                                                                                                                                     
    steps:                                                                                                                                                                                                                                                                                                                                
      - uses: actions/checkout@v4                                                                                                                                                                                                                                                                                                         
      - name: Show Xcode                                                                                                                                                                                                                                                                                                                  
        run: xcodebuild -version                                                                                                                                                                                                                                                                                                          
      - name: Build (no code signing)                                                                                                                                                                                                                                                                                                     
        run: |                                                                                                                                                                                                                                                                                                                            
          set -euxo pipefail                                                                                                                                                                                                                                                                                                              
          xcodebuild \                                                                                                                                                                                                                                                                                                                    
            -project TgWsProxy.xcodeproj \                                                                                                                                                                                                                                                                                                
            -scheme TgWsProxy \                                                                                                                                                                                                                                                                                                           
            -configuration Release \                                                                                                                                                                                                                                                                                                      
            -sdk iphoneos \                                                                                                                                                                                                                                                                                                               
            -derivedDataPath build \                                                                                                                                                                                                                                                                                                      
            CODE_SIGNING_ALLOWED=NO \                                                                                                                                                                                                                                                                                                     
            CODE_SIGNING_REQUIRED=NO \                                                                                                                                                                                                                                                                                                    
            CODE_SIGN_IDENTITY="" \                                                                                                                                                                                                                                                                                                       
            build                                                                                                                                                                                                                                                                                                                         
      - name: Package unsigned .ipa                                                                                                                                                                                                                                                                                                       
        run: |                                                                                                                                                                                                                                                                                                                            
          set -euxo pipefail                                                                                                                                                                                                                                                                                                              
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"                                                                                                                                                                                                                                    
          echo "App: $APP_PATH"                                                                                                                                                                                                                                                                                                           
          rm -rf Payload && mkdir -p Payload                                                                                                                                                                                                                                                                                              
          cp -R "$APP_PATH" Payload/                                                                                                                                                                                                                                                                                                      
          zip -r TgWsProxy-unsigned.ipa Payload                                                                                                                                                                                                                                                                                           
          ls -lh TgWsProxy-unsigned.ipa                                                                                                                                                                                                                                                                                                   
      - uses: actions/upload-artifact@v4                                                                                                                                                                                                                                                                                                  
        with:                                                                                                                                                                                                                                                                                                                             
          name: TgWsProxy-unsigned-ipa                                                                                                                                                                                                                                                                                                    
          path: TgWsProxy-unsigned.ipa                                                                                                                                                                                                                                                                                                    
          retention-days: 7
